<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Duda Razonable · Redireccionando...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirige al index preservando el path y query
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var cleanPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var query = l.search ? (cleanPath ? '&' : '?') + l.search.slice(1) : '';
      var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?' +
        (cleanPath ? 'scene=' + cleanPath : '') + query + l.hash;
      l.replace(newUrl);
    </script>
  </head>
  <body style="background:#070d1e;color:#cbd5e1;font-family:sans-serif;padding:2rem;text-align:center;">
    <p>Redireccionando al caso «Duda Razonable»...</p>
  </body>
</html>
